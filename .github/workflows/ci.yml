name: CI

# Runs on every push to main and on every pull request targeting main — a green result on both
# jobs is the gate for merging. Enable it as a required check under
# Settings → Branches → Branch protection rules for `main`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-composer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team-composer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b && vite build` — the typecheck is part of it.
      - name: Typecheck & build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-composer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team-composer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('team-composer/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
