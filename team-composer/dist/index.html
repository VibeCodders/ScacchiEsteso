    <script>
      // Apply the persisted/OS theme before first paint, so the app never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('scacchi-esteso-theme');
          if (stored === 'dark' || (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
